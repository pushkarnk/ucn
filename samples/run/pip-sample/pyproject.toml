[project]
name = "sampleapp"
version = "0.1.0"
description = "Minimal sample web service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2",
]
 
[project.scripts]
sampleapp = "sampleapp.app:main"
 
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[tool.setuptools.packages.find]
where = ["src"]
