name: cargo-sample
version: "0.1"
summary: A sample Cargo (Rust) web application
ubuntu-version: "24.04"

runtime-deps:
  - cargo
  - rustc

environment:
  CARGO_HOME: /deps

run:
  setup-command: |
    apt update
    apt install -y ca-certificates gcc
    cargo fetch --locked
  start-command: cargo run --offline
  stop-command: pkill -INT -f cargo-sample
  port-forward: "8080"
  readiness:
    probe: curl -fsS http://127.0.0.1:8080/
    timeout: 120
  watch:
    paths: [src, static, Cargo.toml]
    ignore: [target]
