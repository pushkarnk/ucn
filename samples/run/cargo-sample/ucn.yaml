name: cargo-sample
version: 0.1
description: A sample Cargo (Rust) web application
ubuntu-version: 24.04
runtime-deps:
  - cargo
  - rustc
environment:
  CARGO_HOME: /deps
port-forward: 8080
setup-command: "apt update && apt install -y ca-certificates gcc && cargo fetch --locked"
start-command: "cargo run --offline"
stop-command: "pkill -INT -f cargo-sample"
readiness-probe: "curl -fsS http://127.0.0.1:8080/"
readiness-timeout: 120
watch:
  paths: [src, static, Cargo.toml]
  ignore: [target]
