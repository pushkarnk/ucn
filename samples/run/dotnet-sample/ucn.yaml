name: dotnet-sample
version: 0.1
description: A sample .NET application
ubuntu-version: 26.04
runtime-deps:
  - dotnet10
port-forward: 5000
start-command: NUGET_PACKAGES=/deps dotnet run
stop-command: pkill -INT -f dotnet
readiness-probe: "curl -fsS http://127.0.0.1:5000/"
readiness-timeout: 60
watch:
  paths: ["."]
