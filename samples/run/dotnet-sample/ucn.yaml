name: dotnet-sample
version: "0.1"
summary: A sample .NET application
ubuntu-version: "26.04"

runtime-deps:
  - dotnet10

run:
  start-command: NUGET_PACKAGES=/deps dotnet run
  stop-command: pkill -INT -f dotnet
  port-forward: "5000"
  readiness:
    probe: curl -fsS http://127.0.0.1:5000/
    timeout: 60
  watch:
    paths: ["."]
