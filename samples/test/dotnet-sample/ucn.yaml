name: dotnet-sample
version: 0.1
description: A sample .NET web application with run and test NuGet dependencies
ubuntu-version: 24.04
toolchain: dotnet
toolchain-version: 8.0
environment:
  NUGET_PACKAGES: /deps
runtime-deps:
  - dotnet8
port-forward: 5000
setup-command: 'dotnet restore && dotnet test --no-restore --logger "console;verbosity=normal"'
start-command: 'dotnet run --project DotnetSample --no-restore'
test-command: 'dotnet test'
stop-command: 'pkill -INT -f "dotnet.*DotnetSample"'
readiness-probe: "curl -fsS http://127.0.0.1:5000/"
readiness-timeout: 60
watch:
  paths: ["."]
  ignore: [bin, obj]
