name: dotnet-sample
version: "0.1"
summary: A sample .NET web application with run and test NuGet dependencies
ubuntu-version: "24.04"
toolchain: dotnet
toolchain-version: "8.0"

runtime-deps:
  - dotnet8

environment:
  NUGET_PACKAGES: /deps

run:
  setup-command: |
    dotnet restore
    dotnet test --no-restore --logger "console;verbosity=normal"
  start-command: dotnet run --project DotnetSample --no-restore
  stop-command: pkill -INT -f "dotnet.*DotnetSample"
  port-forward: "5000"
  readiness:
    probe: curl -fsS http://127.0.0.1:5000/
    timeout: 60
  watch:
    paths: ["."]
    ignore: [bin, obj]

test:
  test-command: dotnet test
