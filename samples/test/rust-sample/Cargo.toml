[package]
name = "rust-sample"
version = "1.0.0"
edition = "2021"
description = "A sample Cargo (Rust) web application with run and test dependencies"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Test-only dependencies (not linked into the release binary)
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
